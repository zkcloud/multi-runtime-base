name: Images
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release only on main; vX.Y.Z (empty = validation only)"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  verify:
    name: verify-${{ matrix.variant }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        variant: [base, build]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: mkdir -p reports
      - name: Resolve immutable upstream inputs
        id: upstream
        run: |
          set -euo pipefail
          for pair in "ubuntu=ubuntu:24.04" "node=node:24-bookworm-slim" "java=eclipse-temurin:21-jdk-noble"; do
            key="${pair%%=*}"
            ref="${pair#*=}"
            docker buildx imagetools inspect "$ref" > "reports/upstream-$key.txt"
            digest="$(awk '$1 == "Digest:" {print $2; exit}' "reports/upstream-$key.txt")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf '%s=%s@%s\n' "$key" "$ref" "$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Build optimized image
        id: optimized
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: local/${{ matrix.variant }}:test
          build-args: |
            TRIM=1
            UBUNTU_IMAGE=${{ steps.upstream.outputs.ubuntu }}
            NODE_IMAGE=${{ steps.upstream.outputs.node }}
            JAVA_IMAGE=${{ steps.upstream.outputs.java }}
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}-${{ matrix.variant }}
          provenance: false
      - name: Record build metadata
        env:
          METADATA: ${{ steps.optimized.outputs.metadata }}
        run: printf '%s\n' "$METADATA" > reports/build-metadata.json
      - name: Build untrimmed reference
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: local/${{ matrix.variant }}:baseline
          build-args: |
            TRIM=0
            UBUNTU_IMAGE=${{ steps.upstream.outputs.ubuntu }}
            NODE_IMAGE=${{ steps.upstream.outputs.node }}
            JAVA_IMAGE=${{ steps.upstream.outputs.java }}
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.variant }}
          provenance: false
      - name: Measure image sizes and layers
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker run --rm "local/$VARIANT:test" dpkg --print-architecture)" = "$ARCH"
          python3 scripts/measure.py "$VARIANT" "$ARCH" | tee reports/sizes.json
          docker history --no-trunc "local/$VARIANT:test" > reports/history.txt
          docker image inspect "local/$VARIANT:test" > reports/inspect.json
          docker run --rm "local/$VARIANT:test" bash -c 'du -x -k -d 2 /usr /opt /var 2>/dev/null; dpkg-query -W' > reports/inventory.txt
      - name: Functional tests
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/tests:/tests:ro" "local/$VARIANT:test" bash /tests/functional.sh "$VARIANT" 2>&1 | tee reports/functional.log
      - name: All ELF shared library dependencies
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/tests:/tests:ro" "local/$VARIANT:test" python /tests/libraries.py 2>&1 | tee reports/libraries.log
      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.76.1
          image-ref: local/${{ matrix.variant }}:test
          format: json
          output: reports/trivy.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
      - name: SPDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.76.1
          image-ref: local/${{ matrix.variant }}:test
          format: spdx-json
          output: reports/sbom.spdx.json
          exit-code: "0"
      - name: Enforce security gate
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open("reports/trivy.json"))
          findings = [v for r in report.get("Results", []) for v in r.get("Vulnerabilities", [])
                      if v.get("Severity") in ("HIGH", "CRITICAL")]
          print("HIGH/CRITICAL findings:", len(findings))
          for v in findings:
              print(v["VulnerabilityID"], v["PkgName"], v["InstalledVersion"], v.get("FixedVersion", "unfixed"))
          if findings:
              raise SystemExit(1)
          PY
      - name: Save verified image for release
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != '' && github.ref == 'refs/heads/main'
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: docker save "local/$VARIANT:test" -o "reports/$VARIANT-$ARCH.tar"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports-${{ matrix.variant }}-${{ matrix.arch }}
          path: reports/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.release_version != '' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate release version
        env:
          VERSION: ${{ inputs.release_version }}
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: reports-*
          path: artifacts
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image archives and multiarch manifests
        env:
          VERSION: ${{ inputs.release_version }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          for variant in base build; do
            for arch in amd64 arm64; do
              docker load -i "artifacts/reports-$variant-$arch/$variant-$arch.tar"
              docker tag "local/$variant:test" "$image:$variant-$SHA-$arch"
              docker push "$image:$variant-$SHA-$arch"
              docker image rm "local/$variant:test" "$image:$variant-$SHA-$arch"
            done
            docker buildx imagetools create -t "$image:$variant-$VERSION" "$image:$variant-$SHA-amd64" "$image:$variant-$SHA-arm64"
            docker buildx imagetools inspect "$image:$variant-$VERSION"
          done
